<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Loupe logo — agent portal</title>
  <desc id="desc">A playful terminal agent emerging through a colorful observation portal.</desc>

  <rect width="1024" height="1024" fill="#11181C"/>

  <!-- A lively observation portal: deliberately open, asymmetric, and in motion. -->
  <circle
    cx="512"
    cy="512"
    r="305"
    fill="none"
    stroke="#25B7C7"
    stroke-width="112"
    stroke-linecap="round"
    stroke-dasharray="1510 407"
    transform="rotate(63 512 512)"
  />
  <path
    d="M 712 282 C 768 328 806 383 823 447"
    fill="none"
    stroke="#DC624B"
    stroke-width="62"
    stroke-linecap="round"
  />

  <!-- Orbiting subagents replace the clinical-looking execution tree. -->
  <g transform="rotate(12 758 278)">
    <rect x="700" y="220" width="116" height="116" rx="35" fill="#F2F1EB" stroke="#11181C" stroke-width="22"/>
    <path d="M 732 260 L 756 278 L 732 296" fill="none" stroke="#11181C" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 771 298 H 790" fill="none" stroke="#25B7C7" stroke-width="15" stroke-linecap="round"/>
  </g>
  <g transform="rotate(-16 249 686)">
    <rect x="194" y="631" width="110" height="110" rx="34" fill="#DC624B" stroke="#11181C" stroke-width="22"/>
    <path d="M 225 669 L 247 686 L 225 703" fill="none" stroke="#11181C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 260 705 H 279" fill="none" stroke="#F2F1EB" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Root agent: a chunky, friendly terminal tile with an offset color pop. -->
  <g transform="rotate(-7 512 520)">
    <rect x="340" y="386" width="382" height="302" rx="92" fill="#DC624B"/>
    <rect x="310" y="356" width="382" height="302" rx="92" fill="#F2F1EB" stroke="#11181C" stroke-width="28"/>

    <path
      d="M 408 447 L 476 507 L 408 567"
      fill="none"
      stroke="#11181C"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path d="M 526 571 H 608" fill="none" stroke="#25B7C7" stroke-width="46" stroke-linecap="round"/>

    <circle cx="636" cy="414" r="25" fill="#DC624B" stroke="#11181C" stroke-width="13"/>
  </g>

  <!-- Loose pixels keep the mark energetic at large sizes without hurting the avatar read. -->
  <circle cx="170" cy="354" r="24" fill="#F2F1EB"/>
  <rect x="838" y="601" width="42" height="42" rx="12" fill="#F2F1EB" transform="rotate(18 859 622)"/>
  <circle cx="744" cy="807" r="17" fill="#DC624B"/>
</svg>
