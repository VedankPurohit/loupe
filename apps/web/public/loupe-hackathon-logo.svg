<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Loupe logo</title>
  <desc id="desc">A geometric loupe examining a branching coding-agent execution graph.</desc>

  <rect width="1024" height="1024" fill="#F2F1EB"/>

  <!-- The interrupted ring reads as both an optical instrument and an honest capture boundary. -->
  <circle
    cx="446"
    cy="418"
    r="266"
    fill="none"
    stroke="#11181C"
    stroke-width="76"
    stroke-linecap="round"
    stroke-dasharray="1497 175"
    transform="rotate(35 446 418)"
  />

  <!-- A live cyan observation arc makes the silhouette distinctive at small sizes. -->
  <path
    d="M 258 230 A 266 266 0 0 1 461 153"
    fill="none"
    stroke="#25B7C7"
    stroke-width="76"
    stroke-linecap="round"
  />

  <!-- The handle continues the evidence path instead of attaching as a generic search icon. -->
  <path
    d="M 633 609 L 806 782"
    fill="none"
    stroke="#11181C"
    stroke-width="92"
    stroke-linecap="round"
  />
  <path
    d="M 671 647 L 806 782"
    fill="none"
    stroke="#DC624B"
    stroke-width="22"
    stroke-linecap="round"
  />

  <!-- Root-and-subagent topology inside the lens. -->
  <path
    d="M 446 344 V 411 M 446 411 L 342 512 M 446 411 L 518 496 M 446 411 L 570 410"
    fill="none"
    stroke="#11181C"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The root node borrows Loupe's original half-disc motif. -->
  <circle cx="446" cy="309" r="58" fill="#11181C"/>
  <path d="M 446 251 A 58 58 0 0 0 446 367 Z" fill="#25B7C7"/>

  <circle cx="342" cy="512" r="38" fill="#25B7C7" stroke="#11181C" stroke-width="18"/>
  <circle cx="518" cy="496" r="38" fill="#F2F1EB" stroke="#11181C" stroke-width="18"/>

  <!-- One cited evidence point is deliberately singled out for inspection. -->
  <circle cx="588" cy="410" r="46" fill="#DC624B" stroke="#11181C" stroke-width="18"/>
  <circle cx="588" cy="410" r="11" fill="#F2F1EB"/>
</svg>
