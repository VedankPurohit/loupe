name: coding-agent-observability

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_observer}
      POSTGRES_USER: ${POSTGRES_USER:-agent_observer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_observer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # This committed profile is loopback HTTP. The server image itself keeps
      # NODE_ENV=production so hosted HTTPS deployments emit Secure cookies.
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agent_observer}:${POSTGRES_PASSWORD:-agent_observer}@postgres:5432/${POSTGRES_DB:-agent_observer}
      - HOST=0.0.0.0
      - PORT=3000
      - BOOTSTRAP_CODE
      - GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}
      - GOOGLE_AUTH_ALLOWED_ORIGINS=${GOOGLE_AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:${WEB_PORT:-8080}}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
